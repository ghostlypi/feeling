        .lonely-frame {
            max-width: 580px;
            margin: 48px auto;
            text-align: center;
        }
        .lonely-prompt {
            color: #888;
            font-size: 0.9rem;
            margin: 0 0 28px;
        }
        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .symbol-btn {
            font-family: 'SUSE Mono', monospace;
            font-size: 1.7rem;
            aspect-ratio: 1;
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            color: #f0f0f0;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.15s, opacity 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .symbol-btn:hover:not(:disabled) {
            background: #333;
            border-color: #20c997;
            transform: scale(1.08);
        }
        .symbol-btn:active:not(:disabled) {
            transform: scale(0.95);
        }
        .symbol-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }
        .symbol-msg {
            min-height: 1.4em;
            font-size: 0.82rem;
            color: #555;
            margin-bottom: 16px;
            font-family: 'SUSE Mono', monospace;
        }
        .grid-controls {
            display: flex;
            justify-content: center;
        }
        .next-btn {
            font-family: 'SUSE', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 32px;
            border: 1px solid #444;
            border-radius: 50px;
            background: transparent;
            color: #888;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s, transform 0.2s;
        }
        .next-btn:hover {
            border-color: #20c997;
            color: #20c997;
            transform: scale(1.04);
        }
        .invite-section {
            display: none;
        }
        .invite-msg {
            color: #20c997;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }
        .invite-btn {
            display: inline-block;
            font-family: 'SUSE', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 16px 48px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #20c997, #ff7f50);
            color: #1e1e1e;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .invite-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 28px rgba(32, 201, 151, 0.35);
        }

        @media (max-width: 480px) {
            .symbol-btn { font-size: 1.3rem; }
            .symbol-grid { gap: 7px; }
        }

        /* Light mode */
        body.light-mode .symbol-btn {
            background: #e8e8e8;
            border-color: #ccc;
            color: #1e1e1e;
        }
        body.light-mode .symbol-btn:hover:not(:disabled) {
            background: #f0f0f0;
            border-color: #00ad79;
        }
        body.light-mode .lonely-prompt { color: #666; }
        body.light-mode .symbol-msg    { color: #aaa; }
        body.light-mode .next-btn      { color: #999; border-color: #ccc; }

function drawSurface(elapsed) {
const segments = 16;
const phase = elapsed / 550;
function point(t) {
const envelope = Math.sin(Math.PI * t);
const wave = Math.sin(4 * Math.PI * t - phase);
const amplitude = 14 * surfaceStrength;
return {
x: 420 + 6 * (2 * t - 1) ** 6 + amplitude * envelope * wave,
y: 36 + 188 * t,
slope: 72 * (2 * t - 1) ** 5 + amplitude * Math.PI * (
Math.cos(Math.PI * t) * wave
+ 4 * envelope * Math.cos(4 * Math.PI * t - phase)
),
};
}
let boundary = 'M426 36';
let previous = point(0);
for (let i = 1; i <= segments; i++) {
const next = point(i / segments);
const step = 1 / (segments * 3);
boundary += ` C${previous.x + previous.slope * step} ${previous.y + 188 * step}`
+ ` ${next.x - next.slope * step} ${next.y - 188 * step} ${next.x} ${next.y}`;
previous = next;
}
liquidShape.setAttribute('d', `M0 36 H426${boundary.slice('M426 36'.length)} H0 Z`);

const transitionDuration = 1000;
const gradientHold = 200;
let finishing = false;
function renderTransition(amount) {
const blend = amount * amount * (3 - 2 * amount);
const remaining = 1 - blend;
surfaceStrength = remaining;
if (remaining === 0) drawSurface(0);
fluid.setAttribute('opacity', blend);
meniscus.setAttribute('opacity', remaining * remaining);
bubbles.setAttribute('opacity', remaining);
bubbles.setAttribute('data-active', remaining > 0 ? 'true' : 'false');
cloud.setAttribute('opacity', Math.sin(blend * Math.PI) * .8);

wrapper.classList.add('loaded');
wrapper.setAttribute('aria-hidden', 'true');
document.dispatchEvent(new CustomEvent('loaderComplete'));
}

renderTransition(1);
container.setAttribute('aria-valuenow', '100');
container.setAttribute('aria-valuetext', 'Loaded');
const delay = Math.max(
reducedMotion.matches ? 0 : gradientHold,
minimumDisplay - (performance.now() - shownAt)
);
if (delay > 0) window.setTimeout(revealPage, delay);
else revealPage();
}

if (finishing) return;
finishing = true;
if (reducedMotion.matches) { complete(); return; }
function startTransition() {
if (reducedMotion.matches) { complete(); return; }
const started = performance.now();
function animate(now) {
const amount = Math.min(1, (now - started) / transitionDuration);
renderTransition(amount);
if (amount < 1 && !reducedMotion.matches) requestAnimationFrame(animate);
else complete();
}

}
const delay = Math.max(0,
minimumDisplay - transitionDuration - gradientHold - (performance.now() - shownAt)
);
if (delay > 0) window.setTimeout(startTransition, delay);
else startTransition();

            (function tick() {
                const rem = getCooldownRemaining();
                if (rem <= 0) {
                    locked = false;
                    msgEl.textContent = '';
                    // Restore URL without hash, keeping existing ?theme= param
                    history.replaceState(null, '', location.pathname + location.search);
                    return;
                }
                msgEl.textContent = prefix
                    ? prefix + ' (' + Math.ceil(rem / 1000) + 's)'
                    : 'cooldown: ' + Math.ceil(rem / 1000) + 's';
                setTimeout(tick, 200);
            })();
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function buildGrid() {
            const grid = document.getElementById('symbol-grid');
            grid.innerHTML = '';
            if (!locked) document.getElementById('symbol-msg').textContent = '';
            shuffle(pool).slice(0, GRID_SIZE).forEach(sym => {
                const btn = document.createElement('button');
                btn.className = 'symbol-btn';
                btn.textContent = sym;
                btn.addEventListener('click', () => onPick(sym));
                grid.appendChild(btn);
            });
        }

        function onPick(sym) {
            if (locked) return;
            if (sym.codePointAt(0) === TARGET) {
                document.getElementById('symbol-grid').style.display    = 'none';
                document.getElementById('symbol-msg').style.display     = 'none';
                document.getElementById('grid-controls').style.display  = 'none';
                const section = document.getElementById('invite-section');
                const link    = document.getElementById('invite-link');
                section.style.display = 'block';
                try { link.href = atob(inviteUrl); } catch (e) { link.href = inviteUrl; }
            } else {
                const msg = wrongMsgs[wrongCount % wrongMsgs.length];
                wrongCount++;
                location.hash = 'cd=' + Date.now();
                beginCooldown(msg);
            }
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            if (locked) return;
            buildGrid();
        });

        // Resume cooldown if page was refreshed mid-cooldown
        const remaining = getCooldownRemaining();
        if (remaining > 0) beginCooldown('');

        buildGrid();
    });
    </script>
