<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>just don't.</title>
    <link rel="icon" href="../images/favicon.png" type="image/png">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/loader.css">
    <link rel="stylesheet" href="" id="theme-style">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SUSE+Mono:ital,wght@0,100..800;1,100..800&family=SUSE:ital,wght@0,100..900;1,100..900&display=swap"
          rel="stylesheet">
    <style>
        .dont-stage {
            min-height: calc(100vh - 260px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .dont-line {
            font-size: clamp(3rem, 15vw, 9rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1;
            margin: 0;
        }
        .dont-line .dont-dot { color: #ff7f50; }

        .dont-aside {
            font-family: 'SUSE Mono', monospace;
            font-size: 0.85rem;
            color: #666;
            margin: 0;
            min-height: 1.4em;
            opacity: 0;
            transition: opacity 1.1s ease;
        }
        .dont-aside--shown { opacity: 1; }

        /* Light mode */
        body.light-mode .dont-aside { color: #999; }

        @media (prefers-reduced-motion: reduce) {
            .dont-aside { transition: none; }
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div id="loader-wrapper">
        <div class="loader-container">
            <div class="liquid" id="liquid">
                <div class="bubbles" id="bubbles"></div>
            </div>
        </div>
    </div>

    <nav>
        <div class="nav-container">
            <a href="../index.html" class="logo-title-link">
                <div class="logo-title">
                    <img src="../images/favicon.png" alt="Logo" class="logo">
                    <span class="site-title">I'm Feeling...</span>
                </div>
            </a>
            <ul>
                <li>
                    <div class="theme-switch-wrapper">
                        <label class="theme-switch" for="checkbox">
                            <input type="checkbox" id="checkbox" />
                            <div class="slider round">
                                <div class="slider-icons">
                                    <i class="fa-solid fa-sun"></i>
                                    <i class="fa-solid fa-moon"></i>
                                </div>
                            </div>
                        </label>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="dont-stage">
            <h1 class="dont-line">just don't<span class="dont-dot">.</span></h1>
            <p class="dont-aside" id="dont-aside"></p>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // The joke is that the page refuses to escalate. It only sighs at you for staying.
        const aside = document.getElementById('dont-aside');
        const beats = [
            { at: 10000, text: 'still here?' },
            { at: 24000, text: 'okay. suit yourself.' }
        ];

        beats.forEach(beat => {
            setTimeout(() => {
                aside.classList.remove('dont-aside--shown');
                setTimeout(() => {
                    aside.textContent = beat.text;
                    aside.classList.add('dont-aside--shown');
                }, 200);
            }, beat.at);
        });
    });
    </script>

    <footer>
        <p style="text-align: center; font-size: 0.78rem; color: #555;">Copyright &copy; 2025-2026 Parth Iyer. All rights reserved.</p>
        <p class="footer-legal"><a href="https://parthiyer.com/policy/tnc.html" target="_blank" rel="noopener">Terms &amp; Conditions</a></p>
    </footer>

    <script src="../js/theme.js"></script>
    <script src="../js/loader.js"></script>
</body>
</html>
